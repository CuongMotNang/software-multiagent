<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cảnh báo lỗi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .modal { display: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow-sm py-4">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <h1 class="text-2xl font-semibold text-gray-800">Cảnh báo lỗi</h1>
      <a href="06_dashboard.html" class="text-blue-600 hover:underline">← Quay lại Dashboard</a>
    </div>
  </header>

  <!-- Alerts List -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-4xl mx-auto py-6 px-4 space-y-4">
      <!-- Alert Card -->
      <div class="bg-red-50 border border-red-200 rounded-lg p-4 flex items-start justify-between">
        <div class="flex-1">
          <h2 class="text-lg font-medium text-red-800">Lỗi hệ thống: Không thể kết nối tới Zalo API</h2>
          <p class="text-sm text-red-600 mt-1">Thời gian: 2026-07-02 14:32:10</p>
        </div>
        <div class="flex items-center space-x-2 ml-4">
          <button data-id="1" class="detail-btn text-sm text-red-700 underline">Xem chi tiết</button>
          <button data-id="1" class="dismiss-btn text-gray-500 hover:text-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 flex items-start justify-between">
        <div class="flex-1">
          <h2 class="text-lg font-medium text-yellow-800">Cảnh báo: Ngưỡng 10 000 tin/ngày đã gần đạt</h2>
          <p class="text-sm text-yellow-600 mt-1">Thời gian: 2026-07-02 09:15:42</p>
        </div>
        <div class="flex items-center space-x-2 ml-4">
          <button data-id="2" class="detail-btn text-sm text-yellow-700 underline">Xem chi tiết</button>
          <button data-id="2" class="dismiss-btn text-gray-500 hover:text-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-start justify-between">
        <div class="flex-1">
          <h2 class="text-lg font-medium text-blue-800">Thông báo: Bot đã được bật lại</h2>
          <p class="text-sm text-blue-600 mt-1">Thời gian: 2026-07-01 22:05:00</p>
        </div>
        <div class="flex items-center space-x-2 ml-4">
          <button data-id="3" class="detail-btn text-sm text-blue-700 underline">Xem chi tiết</button>
          <button data-id="3" class="dismiss-btn text-gray-500 hover:text-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="modal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white rounded-lg max-w-lg w-full mx-4 p-6 relative">
      <button id="closeModal" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round"
             stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <h2 class="text-xl font-semibold mb-4">Chi tiết cảnh báo</h2>
      <p id="modalContent" class="text-gray-700 whitespace-pre-line"></p>
    </div>
  </div>

  <script>
    // Mock detail data
    const details = {
      1: `Mã lỗi: ZL-500\nMô tả: Kết nối tới Zalo API thất bại do timeout.\nHành động: Kiểm tra mạng, xác thực token API.`,
      2: `Số tin đã gửi: 9,850\nNgưỡng: 10,000\nKhuyến nghị: Giảm tần suất gửi hoặc tăng hạn mức qua Zalo.`,
      3: `Người bật: admin@example.com\nThời gian: 2026-07-01 22:05:00\nBot đã chuyển sang trạng thái "Bật".`
    };

    document.querySelectorAll('.dismiss-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const card = e.target.closest('div').parentElement.parentElement;
        card.remove();
      });
    });

    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    document.querySelectorAll('.detail-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const id = e.target.getAttribute('data-id');
        modalContent.textContent = details[id] || 'Không có thông tin chi tiết.';
        modal.style.display = 'flex';
      });
    });
    document.getElementById('closeModal').addEventListener('click', () => {
      modal.style.display = 'none';
    });
    // Close modal on outside click
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.style.display = 'none';
    });
  </script>
</body>
</html>
