<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Form Lịch Thi</title>
<style>
  body {
    margin: 0;
    padding: 32px;

    font-size: 14px;

<body>
<div style="display:flex;flex-direction:column;gap:16px;"><div style="font-size:24px;font-weight:bold;margin-bottom:8px;">Tạo/Lưu Lịch Thi</div><div style="margin-bottom:4px;"><label style="display:block;margin-bottom:4px;font-size:12px;">Tên kỳ thi *</label><input type="text" placeholder="" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;font-family:inherit;box-sizing:border-box;" /></div><div style="margin-bottom:8px;"><label style="display:block;margin-bottom:4px;">Môn học</label><select style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;"><option>{&#x27;value&#x27;: &#x27;math&#x27;, &#x27;label&#x27;: &#x27;Toán&#x27;}</option><option>{&#x27;value&#x27;: &#x27;physics&#x27;, &#x27;label&#x27;: &#x27;Vật lý&#x27;}</option><option>{&#x27;value&#x27;: &#x27;chemistry&#x27;, &#x27;label&#x27;: &#x27;Hóa học&#x27;}</option><option>{&#x27;value&#x27;: &#x27;literature&#x27;, &#x27;label&#x27;: &#x27;Văn học&#x27;}</option></select></div><div style="margin-bottom:4px;"><label style="display:block;margin-bottom:4px;font-size:12px;">Ngày bắt đầu *</label><input type="date" placeholder="" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;font-family:inherit;box-sizing:border-box;" /></div><div style="margin-bottom:4px;"><label style="display:block;margin-bottom:4px;font-size:12px;">Ngày kết thúc *</label><input type="date" placeholder="" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;font-family:inherit;box-sizing:border-box;" /></div><div style="margin-bottom:8px;"><label style="display:block;margin-bottom:4px;">Trạng thái</label><select style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;"><option>{&#x27;value&#x27;: &#x27;pending&#x27;, &#x27;label&#x27;: &#x27;Đang chờ duyệt&#x27;}</option><option>{&#x27;value&#x27;: &#x27;ongoing&#x27;, &#x27;label&#x27;: &#x27;Đang diễn ra&#x27;}</option><option>{&#x27;value&#x27;: &#x27;completed&#x27;, &#x27;label&#x27;: &#x27;Hoàn thành&#x27;}</option></select></div><button style="background:#2C5F2D;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;font-family:inherit;cursor:pointer;">Lưu</button></div>
</body>
