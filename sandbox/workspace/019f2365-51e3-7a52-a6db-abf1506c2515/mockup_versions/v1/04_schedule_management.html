<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý lịch gửi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .modal {
      transition: opacity 0.25s ease;
    }
    .modal-active {
      overflow-y: hidden;
    }
  </style>
</head>
<body class="bg-gray-100 font-['Inter']">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-semibold text-gray-800">Quản lý lịch gửi</h1>
      <nav>
        <a href="02_dashboard.html" class="text-blue-600 hover:underline">← Quay lại Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-medium text-gray-700">Danh sách lịch gửi</h2>
      <button id="openAddModal" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 focus:outline-none">
        Thêm lịch gửi
      </button>
    </div>

    <div class="overflow-x-auto bg-white rounded shadow">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">#</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Tên chiến dịch</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Nội dung</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Thời gian gửi</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Trạng thái</th>
            <th class="px-4 py-2 text-center text-sm font-medium text-gray-600">Hành động</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-sm text-gray-700">1</td>
            <td class="px-4 py-2 text-sm text-gray-700">Khuyến mãi mùa hè</td>
            <td class="px-4 py-2 text-sm text-gray-700">Giảm giá 20% cho tất cả sản phẩm!</td>
            <td class="px-4 py-2 text-sm text-gray-700">2026-07-10 09:00</td>
            <td class="px-4 py-2 text-sm">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Bật</span>
            </td>
            <td class="px-4 py-2 text-center space-x-2">
              <button data-id="1" class="editBtn bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">Sửa</button>
              <button data-id="1" class="deleteBtn bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Xóa</button>
            </td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-sm text-gray-700">2</td>
            <td class="px-4 py-2 text-sm text-gray-700">Nhắc lịch hẹn</td>
            <td class="px-4 py-2 text-sm text-gray-700">Bạn có lịch hẹn vào ngày 15/07.</td>
            <td class="px-4 py-2 text-sm text-gray-700">2026-07-14 15:30</td>
            <td class="px-4 py-2 text-sm">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">Tắt</span>
            </td>
            <td class="px-4 py-2 text-center space-x-2">
              <button data-id="2" class="editBtn bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">Sửa</button>
              <button data-id="2" class="deleteBtn bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Xóa</button>
            </td>
          </tr>
          <!-- Thêm các dòng mẫu khác nếu muốn -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal (Add / Edit) -->
  <div id="scheduleModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 hidden modal">
    <div class="bg-white rounded-lg w-full max-w-lg mx-4">
      <div class="flex justify-between items-center border-b px-6 py-4">
        <h3 class="text-lg font-medium text-gray-800" id="modalTitle">Thêm lịch gửi</h3>
        <button id="closeModal" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>
      <form id="scheduleForm" class="px-6 py-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên chiến dịch</label>
          <input type="text" id="campaignName" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nội dung tin nhắn</label>
          <textarea id="messageContent" rows="3" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Thời gian gửi</label>
          <input type="datetime-local" id="scheduleTime" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="flex items-center">
          <label class="mr-3 text-sm font-medium text-gray-700">Trạng thái</label>
          <select id="statusSelect" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="on">Bật</option>
            <option value="off">Tắt</option>
          </select>
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" id="cancelBtn" class="px-4 py-2 rounded bg-gray-200 text-gray-700 hover:bg-gray-300">Hủy</button>
          <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Modal handling
    const modal = document.getElementById('scheduleModal');
    const openBtn = document.getElementById('openAddModal');
    const closeBtn = document.getElementById('closeModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const modalTitle = document.getElementById('modalTitle');
    const scheduleForm = document.getElementById('scheduleForm');

    let editMode = false;
    let editId = null;

    function openModal(isEdit = false, data = null) {
      editMode = isEdit;
      if (isEdit && data) {
        modalTitle.textContent = 'Sửa lịch gửi';
        document.getElementById('campaignName').value = data.name;
        document.getElementById('messageContent').value = data.message;
        document.getElementById('scheduleTime').value = data.time;
        document.getElementById('statusSelect').value = data.status;
        editId = data.id;
      } else {
        modalTitle.textContent = 'Thêm lịch gửi';
        scheduleForm.reset();
        editId = null;
      }
      modal.classList.remove('hidden');
      document.body.classList.add('modal-active');
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.classList.remove('modal-active');
    }

    openBtn.addEventListener('click', () => openModal());
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);

    // Mock edit button handling
    document.querySelectorAll('.editBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        // Mock data retrieval
        const mockData = {
          id,
          name: btn.closest('tr').children[1].textContent.trim(),
          message: btn.closest('tr').children[2].textContent.trim(),
          time: btn.closest('tr').children[3].textContent.trim().replace(' ', 'T'),
          status: btn.closest('tr').children[4].textContent.trim().toLowerCase() === 'bật' ? 'on' : 'off'
        };
        openModal(true, mockData);
      });
    });

    // Mock delete handling
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Bạn có chắc muốn xóa lịch này?')) {
          btn.closest('tr').remove();
        }
      });
    });

    // Form submit (mock)
    scheduleForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('campaignName').value;
      const message = document.getElementById('messageContent').value;
      const time = document.getElementById('scheduleTime').value.replace('T', ' ');
      const status = document.getElementById('statusSelect').value === 'on' ? 'Bật' : 'Tắt';

      if (editMode && editId) {
        // Update existing row
        const row = document.querySelector(`button.editBtn[data-id="${editId}"]`).closest('tr');
        row.children[1].textContent = name;
        row.children[2].textContent = message;
        row.children[3].textContent = time;
        row.children[4].innerHTML = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${status === 'Bật' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">${status}</span>`;
      } else {
        // Add new row (mock ID incremental)
        const tbody = document.querySelector('tbody');
        const newId = tbody.children.length + 1;
        const statusBadge = status === 'Bật'
          ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Bật</span>'
          : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">Tắt</span>';
        const newRow = document.createElement('tr');
        newRow.className = 'hover:bg-gray-50';
        newRow.innerHTML = `
          <td class="px-4 py-2 text-sm text-gray-700">${newId}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${name}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${message}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${time}</td>
          <td class="px-4 py-2 text-sm">${statusBadge}</td>
          <td class="px-4 py-2 text-center space-x-2">
            <button data-id="${newId}" class="editBtn bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">Sửa</button>
            <button data-id="${newId}" class="deleteBtn bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Xóa</button>
          </td>
        `;
        tbody.appendChild(newRow);

        // Re-attach event listeners for new buttons
        newRow.querySelector('.editBtn').addEventListener('click', () => {
          const id = newRow.querySelector('.editBtn').getAttribute('data-id');
          const mockData = {
            id,
            name,
            message,
            time: time.replace(' ', 'T'),
            status: status === 'Bật' ? 'on' : 'off'
          };
          openModal(true, mockData);
        });
        newRow.querySelector('.deleteBtn').addEventListener('click', () => {
          if (confirm('Bạn có chắc muốn xóa lịch này?')) {
            newRow.remove();
          }
        });
      }

      closeModal();
    });
  </script>
</body>
</html>
