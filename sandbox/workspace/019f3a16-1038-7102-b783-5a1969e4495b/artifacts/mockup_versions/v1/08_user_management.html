<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .modal { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md hidden md:block">
    <div class="p-4 text-xl font-semibold border-b">Admin Panel</div>
    <nav class="mt-4">
      <a href="01_login.html" class="block py-2 px-4 hover:bg-gray-200">Đăng nhập</a>
      <a href="02_dashboard.html" class="block py-2 px-4 hover:bg-gray-200">Dashboard</a>
      <a href="08_user_management.html" class="block py-2 px-4 bg-gray-200 font-medium">Quản lý người dùng</a>
      <a href="#" class="block py-2 px-4 hover:bg-gray-200">Khóa đề thi</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 overflow-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800">Quản lý người dùng</h1>
      <button id="openModalBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
        Thêm người dùng
      </button>
    </div>

    <div class="bg-white rounded shadow overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">ID</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Tên</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Email</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Vai trò</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Trạng thái</th>
            <th class="px-4 py-2 text-center text-sm font-medium text-gray-600">Hành động</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-sm text-gray-700">1</td>
            <td class="px-4 py-2 text-sm text-gray-700">Nguyễn Văn A</td>
            <td class="px-4 py-2 text-sm text-gray-700">a.nguyen@example.com</td>
            <td class="px-4 py-2 text-sm text-gray-700">Admin</td>
            <td class="px-4 py-2 text-sm text-green-600">Hoạt động</td>
            <td class="px-4 py-2 text-center">
              <button class="text-blue-600 hover:underline mr-2 editBtn" data-id="1">Sửa</button>
              <button class="text-red-600 hover:underline deleteBtn" data-id="1">Xóa</button>
            </td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-sm text-gray-700">2</td>
            <td class="px-4 py-2 text-sm text-gray-700">Trần Thị B</td>
            <td class="px-4 py-2 text-sm text-gray-700">b.tran@example.com</td>
            <td class="px-4 py-2 text-sm text-gray-700">Teacher</td>
            <td class="px-4 py-2 text-sm text-yellow-600">Khóa</td>
            <td class="px-4 py-2 text-center">
              <button class="text-blue-600 hover:underline mr-2 editBtn" data-id="2">Sửa</button>
              <button class="text-red-600 hover:underline deleteBtn" data-id="2">Xóa</button>
            </td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-sm text-gray-700">3</td>
            <td class="px-4 py-2 text-sm text-gray-700">Lê Văn C</td>
            <td class="px-4 py-2 text-sm text-gray-700">c.le@example.com</td>
            <td class="px-4 py-2 text-sm text-gray-700">Student</td>
            <td class="px-4 py-2 text-sm text-green-600">Hoạt động</td>
            <td class="px-4 py-2 text-center">
              <button class="text-blue-600 hover:underline mr-2 editBtn" data-id="3">Sửa</button>
              <button class="text-red-600 hover:underline deleteBtn" data-id="3">Xóa</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div id="userModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center hidden modal">
    <div class="bg-white rounded-lg w-full max-w-md mx-4">
      <div class="flex justify-between items-center border-b px-4 py-2">
        <h2 class="text-lg font-medium">Thêm / Sửa người dùng</h2>
        <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>
      <form id="userForm" class="p-4 space-y-4">
        <input type="hidden" id="userId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
          <input type="text" id="userName" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="userEmail" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Vai trò</label>
          <select id="userRole" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Admin">Admin</option>
            <option value="Teacher">Teacher</option>
            <option value="Student">Student</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="cancelBtn" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById('userModal');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const form = document.getElementById('userForm');
    const userIdField = document.getElementById('userId');
    const nameField = document.getElementById('userName');
    const emailField = document.getElementById('userEmail');
    const roleField = document.getElementById('userRole');

    openBtn.onclick = () => {
      userIdField.value = '';
      nameField.value = '';
      emailField.value = '';
      roleField.value = 'Student';
      modal.classList.remove('hidden');
    };
    closeBtn.onclick = cancelBtn.onclick = () => modal.classList.add('hidden');

    // Mock edit action
    document.querySelectorAll('.editBtn').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        // Mock data retrieval
        const mockData = {
          1: {name: 'Nguyễn Văn A', email: 'a.nguyen@example.com', role: 'Admin'},
          2: {name: 'Trần Thị B', email: 'b.tran@example.com', role: 'Teacher'},
          3: {name: 'Lê Văn C', email: 'c.le@example.com', role: 'Student'}
        };
        const data = mockData[id];
        userIdField.value = id;
        nameField.value = data.name;
        emailField.value = data.email;
        roleField.value = data.role;
        modal.classList.remove('hidden');
      };
    });

    // Mock delete action
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.onclick = () => {
        if (confirm('Bạn có chắc muốn xóa người dùng này?')) {
          alert('Xóa thành công (giả lập).');
        }
      };
    });

    form.onsubmit = (e) => {
      e.preventDefault();
      const id = userIdField.value || Date.now();
      const name = nameField.value;
      const email = emailField.value;
      const role = roleField.value;
      alert(`Lưu thành công (giả lập).\nID: ${id}\nTên: ${name}\nEmail: ${email}\nVai trò: ${role}`);
      modal.classList.add('hidden');
    };
  </script>
</body>
</html>
