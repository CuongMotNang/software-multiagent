<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Zalo Bot Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 space-y-6">
    <div class="text-center">
      <svg class="mx-auto h-12 w-12 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 1.657-1.343 3-3 3S6 12.657 6 11s1.343-3 3-3 3 1.343 3 3zM12 11c0-2.21 1.79-4 4-4s4 1.79 4 4c0 2.21-1.79 4-4 4s-4-1.79-4-4zM6 16c0-2.21 1.79-4 4-4s4 1.79 4 4v2H6v-2z" />
      </svg>
      <h1 class="mt-4 text-2xl font-semibold text-gray-800">Đăng nhập</h1>
      <p class="mt-1 text-sm text-gray-500">Quản trị Console Bot Zalo</p>
    </div>
    <form id="loginForm" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"/>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Mật khẩu</label>
        <input type="password" id="password" name="password" required
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"/>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember" name="remember" type="checkbox"
                 class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
          <label for="remember" class="ml-2 block text-sm text-gray-900">Ghi nhớ</label>
        </div>
        <a href="#" class="text-sm text-indigo-600 hover:underline">Quên mật khẩu?</a>
      </div>
      <button type="submit"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        Đăng nhập
      </button>
    </form>
    <p class="text-center text-sm text-gray-600">
      Chưa có tài khoản? <a href="#" class="text-indigo-600 hover:underline">Đăng ký</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Mock validation
      const email = e.target.email.value.trim();
      const password = e.target.password.value;
      if (email && password) {
        alert('Đăng nhập thành công (mock)');
        // In real app, redirect to dashboard:
        // window.location.href = '02_dashboard.html';
      } else {
        alert('Vui lòng nhập đầy đủ thông tin');
      }
    });
  </script>
</body>
</html>
