<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #34d399; /* emerald-400 */
    }
    .toggle-checkbox:checked + .toggle-label .dot {
      transform: translateX(1.5rem);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex">
  <!-- Sidebar Navigation -->
  <nav class="w-64 bg-white shadow-md hidden md:block">
    <div class="p-6">
      <h2 class="text-xl font-semibold mb-4">Admin Console</h2>
      <ul class="space-y-2">
        <li><a href="01_login.html" class="block py-2 px-3 rounded hover:bg-gray-200">Đăng nhập</a></li>
        <li><a href="02_dashboard.html" class="block py-2 px-3 rounded hover:bg-gray-200">Dashboard</a></li>
        <li><a href="03_scenario_list.html" class="block py-2 px-3 rounded hover:bg-gray-200">Quản lý kịch bản</a></li>
        <li><a href="04_schedule.html" class="block py-2 px-3 rounded hover:bg-gray-200">Quản lý lịch gửi</a></li>
        <li><a href="05_bot_configuration.html" class="block py-2 px-3 rounded bg-gray-200 font-medium">Cấu hình Bot</a></li>
        <li><a href="06_reports.html" class="block py-2 px-3 rounded hover:bg-gray-200">Báo cáo</a></li>
        <li><a href="07_logs.html" class="block py-2 px-3 rounded hover:bg-gray-200">Log & Cảnh báo</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 p-6">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold text-gray-800">Cấu hình Bot</h1>
      <button id="mobileMenuBtn" class="md:hidden p-2 rounded hover:bg-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </header>

    <section class="bg-white rounded-lg shadow p-6 max-w-2xl">
      <form id="botConfigForm" class="space-y-6">
        <!-- Bot Status -->
        <div class="flex items-center justify-between">
          <span class="text-gray-700 font-medium">Trạng thái Bot</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="botStatus" class="sr-only toggle-checkbox" checked>
            <div class="toggle-label w-12 h-6 bg-gray-300 rounded-full transition-colors duration-200">
              <div class="dot absolute left-0 top-0 w-6 h-6 bg-white rounded-full shadow transition-transform duration-200"></div>
            </div>
            <span class="ml-3 text-sm text-gray-600">Bật</span>
          </label>
        </div>

        <!-- Operating Hours -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">Giờ bắt đầu</label>
            <input type="time" id="startTime" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="08:00">
          </div>
          <div>
            <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">Giờ kết thúc</label>
            <input type="time" id="endTime" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="18:00">
          </div>
        </div>

        <!-- Tone of Voice -->
        <div>
          <label for="toneSelect" class="block text-sm font-medium text-gray-700 mb-1">Văn phong trả lời</label>
          <select id="toneSelect" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="professional">Chuyên nghiệp</option>
            <option value="friendly">Thân thiện</option>
            <option value="casual">Cá tính</option>
          </select>
        </div>

        <!-- Daily Message Limit -->
        <div>
          <label for="dailyLimit" class="block text-sm font-medium text-gray-700 mb-1">Giới hạn tin/ngày</label>
          <input type="number" id="dailyLimit" min="1" max="20000" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="10000">
        </div>

        <!-- Save Button -->
        <div class="flex justify-end">
          <button type="button" id="saveBtn"
                  class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            Lưu cấu hình
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- Confirmation Modal -->
  <div id="confirmModal"
       class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg shadow-lg w-11/12 max-w-md p-6">
      <h2 class="text-lg font-semibold mb-4">Xác nhận lưu</h2>
      <p class="mb-6">Bạn có chắc muốn lưu cấu hình bot?</p>
      <div class="flex justify-end space-x-3">
        <button id="cancelBtn"
                class="px-4 py-2 rounded border border-gray-300 hover:bg-gray-100 focus:outline-none">
          Hủy
        </button>
        <button id="confirmBtn"
                class="px-4 py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700 focus:outline-none">
          Đồng ý
        </button>
      </div>
    </div>
  </div>

  <script>
    // Mobile sidebar toggle (optional)
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.querySelector('nav');
    mobileBtn?.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
    });

    // Modal handling
    const saveBtn = document.getElementById('saveBtn');
    const modal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');

    saveBtn.addEventListener('click', () => {
      modal.classList.remove('hidden');
    });

    cancelBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    confirmBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      // Mock save action
      alert('Cấu hình đã được lưu thành công!');
    });
  </script>
</body>
</html>
