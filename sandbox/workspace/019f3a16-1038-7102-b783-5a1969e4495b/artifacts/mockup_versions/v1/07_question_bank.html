<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngân hàng câu hỏi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .modal { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-semibold text-gray-800">Ngân hàng câu hỏi</h1>
      <button id="openModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">
        Thêm câu hỏi
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-7xl mx-auto p-4">
      <!-- Filters -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4 gap-2">
        <div class="flex items-center gap-2">
          <label class="text-sm font-medium text-gray-700">Loại:</label>
          <select class="border rounded-md px-2 py-1">
            <option>Tất cả</option>
            <option>Trắc nghiệm</option>
            <option>Đúng/Sai</option>
            <option>Tự luận</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-sm font-medium text-gray-700">Chủ đề:</label>
          <select class="border rounded-md px-2 py-1">
            <option>Tất cả</option>
            <option>Toán</option>
            <option>Lý</option>
            <option>Hóa</option>
            <option>Văn</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="text" placeholder="Tìm kiếm..." class="border rounded-md px-2 py-1 w-full md:w-64">
        </div>
      </div>

      <!-- Question Table -->
      <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Tiêu đề</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Loại</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Chủ đề</th>
              <th class="px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase">Hành động</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <!-- Mock rows -->
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 text-sm text-gray-700">Q001</td>
              <td class="px-4 py-2 text-sm text-gray-700">Định nghĩa hàm số bậc nhất</td>
              <td class="px-4 py-2 text-sm text-gray-700">Trắc nghiệm</td>
              <td class="px-4 py-2 text-sm text-gray-700">Toán</td>
              <td class="px-4 py-2 text-center">
                <button class="text-indigo-600 hover:underline mr-2">Sửa</button>
                <button class="text-red-600 hover:underline">Xóa</button>
              </td>
            </tr>
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 text-sm text-gray-700">Q002</td>
              <td class="px-4 py-2 text-sm text-gray-700">Định luật Ohm</td>
              <td class="px-4 py-2 text-sm text-gray-700">Đúng/Sai</td>
              <td class="px-4 py-2 text-sm text-gray-700">Lý</td>
              <td class="px-4 py-2 text-center">
                <button class="text-indigo-600 hover:underline mr-2">Sửa</button>
                <button class="text-red-600 hover:underline">Xóa</button>
              </td>
            </tr>
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 text-sm text-gray-700">Q003</td>
              <td class="px-4 py-2 text-sm text-gray-700">Phân tích thơ “Đây thôn Vũ”</td>
              <td class="px-4 py-2 text-sm text-gray-700">Tự luận</td>
              <td class="px-4 py-2 text-sm text-gray-700">Văn</td>
              <td class="px-4 py-2 text-center">
                <button class="text-indigo-600 hover:underline mr-2">Sửa</button>
                <button class="text-red-600 hover:underline">Xóa</button>
              </td>
            </tr>
            <!-- Add more rows as needed -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden modal">
    <div class="bg-white rounded-lg w-full max-w-xl mx-4">
      <div class="flex justify-between items-center border-b px-4 py-2">
        <h2 class="text-lg font-semibold">Thêm câu hỏi mới</h2>
        <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>
      <form class="p-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tiêu đề</label>
          <input type="text" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Nhập tiêu đề câu hỏi">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Loại câu hỏi</label>
          <select class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option>Trắc nghiệm</option>
            <option>Đúng/Sai</option>
            <option>Tự luận</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Chủ đề</label>
          <input type="text" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="VD: Toán, Lý, ...">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');
    const overlay = document.getElementById('modalOverlay');

    openBtn.addEventListener('click', () => overlay.classList.remove('hidden'));
    closeBtn.addEventListener('click', () => overlay.classList.add('hidden'));
    cancelBtn.addEventListener('click', () => overlay.classList.add('hidden'));

    // Close modal on outside click
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.add('hidden');
    });
  </script>
</body>
</html>
