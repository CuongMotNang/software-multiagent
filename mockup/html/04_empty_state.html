<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" Personal Task Manager - Trạng thái rỗng">
  <title>Personal Task Manager - Trạng thái rỗng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .pulse-soft {
      animation: pulse-soft 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <h1 class="text-lg font-semibold text-slate-800">Personal Task Manager</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400 hidden sm:inline">v1.0</span>
      </div>
    </div>
  </header>

  <!-- Filter Tabs (disabled state) -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6">
      <div class="flex gap-1 py-2">
        <button class="px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 rounded-lg border border-indigo-200">
          Tất cả
        </button>
        <button class="px-4 py-2 text-sm font-medium text-slate-400 cursor-not-allowed" disabled>
          Chưa hoàn thành
        </button>
        <button class="px-4 py-2 text-sm font-medium text-slate-400 cursor-not-allowed" disabled>
          Đã hoàn thành
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content - Empty State -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6">
    <div class="max-w-md w-full text-center">
      <!-- Illustration -->
      <div class="float-animation mb-8">
        <div class="w-32 h-32 mx-auto bg-indigo-50 rounded-full flex items-center justify-center">
          <svg class="w-16 h-16 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
        </div>
      </div>

      <!-- Text Content -->
      <h2 class="text-xl font-semibold text-slate-800 mb-3">
        Chưa có nhiệm vụ nào
      </h2>
      <p class="text-slate-500 mb-8 leading-relaxed">
        Bạn chưa có nhiệm vụ nào. Hãy thêm việc cần làm đầu tiên để bắt đầu quản lý công việc của mình.
      </p>

      <!-- CTA Button -->
      <button 
        onclick="openCreateModal()"
        class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors shadow-lg shadow-indigo-200 pulse-soft"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Thêm nhiệm vụ đầu tiên
      </button>

      <!-- Quick hint -->
      <p class="mt-6 text-xs text-slate-400">
        Nhấn nút bên trên hoặc dùng phím tắt <kbd class="px-2 py-1 bg-slate-100 rounded text-slate-500 font-mono text-xs">N</kbd> để tạo nhanh
      </p>
    </div>
  </main>

  <!-- Create Task Modal (hidden by default, shown via JS) -->
  <div id="createModal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeCreateModal()"></div>
    
    <!-- Modal Content -->
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg transform transition-all">
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 class="text-lg font-semibold text-slate-800">Tạo nhiệm vụ mới</h3>
          <button onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        
        <!-- Modal Body -->
        <div class="px-6 py-5 space-y-4">
          <!-- Title Input -->
          <div>
            <label for="taskTitle" class="block text-sm font-medium text-slate-700 mb-1">
              Tiêu đề <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              id="taskTitle" 
              placeholder="Nhập tiêu đề nhiệm vụ..."
              maxlength="200"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
              oninput="updateCharCount(this)"
            >
            <div class="flex justify-between mt-1">
              <span id="titleError" class="text-xs text-red-500 hidden">Tiêu đề không được để trống</span>
              <span id="charCount" class="text-xs text-slate-400 ml-auto">0/200</span>
            </div>
          </div>
          
          <!-- Description Input -->
          <div>
            <label for="taskDesc" class="block text-sm font-medium text-slate-700 mb-1">
              Mô tả <span class="text-slate-400 font-normal">(tùy chọn)</span>
            </label>
            <textarea 
              id="taskDesc" 
              rows="3"
              placeholder="Thêm mô tả chi tiết..."
              maxlength="1000"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none"
            ></textarea>
            <span class="text-xs text-slate-400">Tối đa 1000 ký tự</span>
          </div>
        </div>
        
        <!-- Modal Footer -->
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100">
          <button onclick="closeCreateModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 transition-colors">
            Hủy
          </button>
          <button 
            onclick="createTask()"
            class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors"
          >
            Tạo nhiệm vụ
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <span id="toastMessage">Thông báo</desc>
  </div>

  <script>
    // Modal functions
    function openCreateModal() {
      document.getElementById('createModal').classList.remove('hidden');
      document.getElementById('taskTitle').focus();
    }
    
    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
      // Reset form
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDesc').value = '';
      document.getElementById('charCount').textContent = '0/200';
      document.getElementById('titleError').classList.add('hidden');
    }
    
    // Character count
    function updateCharCount(input) {
      const count = input.value.length;
      document.getElementById('charCount').textContent = `${count}/200`;
      
      // Visual feedback when approaching limit
      const countEl = document.getElementById('charCount');
      if (count >= 180) {
        countEl.className = 'text-xs text-amber-500 ml-auto';
      } else if (count >= 200) {
        countEl.className = 'text-xs text-red-500 ml-auto';
      } else {
        countEl.className = 'text-xs text-slate-400 ml-auto';
      }
    }
    
    // Create task with validation
    function createTask() {
      const titleInput = document.getElementById('taskTitle');
      const title = titleInput.value.trim();
      const desc = document.getElementById('taskDesc').value.trim();
      
      // Validation
      if (!title) {
        document.getElementById('titleError').classList.remove('hidden');
        titleInput.classList.add('border-red-300', 'focus:border-red-500', 'focus:ring-red-500');
        titleInput.focus();
        return;
      }
      
      // Success - show toast and close modal
      showToast('Nhiệm vụ đã được tạo thành công!');
      closeCreateModal();
    }
    
    // Toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
    
    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
      if (e.key === 'n' || e.key === 'N') {
        if (document.getElementById('createModal').classList.contains('hidden')) {
          openCreateModal();
        }
      }
      if (e.key === 'Escape') {
        closeCreateModal();
      }
    });
  </script>
</body>
</html>
