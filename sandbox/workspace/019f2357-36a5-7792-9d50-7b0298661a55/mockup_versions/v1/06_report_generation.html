<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo - Chatbot Zalo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {font-family: 'Inter', sans-serif;}
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <nav class="bg-white w-full md:w-64 p-4 border-r border-gray-200">
      <h2 class="text-xl font-semibold mb-6">Admin</h2>
      <ul class="space-y-2">
        <li><a href="01_login.html" class="block py-2 px-3 rounded hover:bg-gray-100">Đăng nhập</a></li>
        <li><a href="02_dashboard.html" class="block py-2 px-3 rounded hover:bg-gray-100">Dashboard</a></li>
        <li><a href="03_script_management.html" class="block py-2 px-3 rounded hover:bg-gray-100">Quản lý kịch bản</a></li>
        <li><a href="04_schedule.html" class="block py-2 px-3 rounded hover:bg-gray-100">Lịch gửi</a></li>
        <li><a href="06_report_generation.html" class="block py-2 px-3 rounded bg-blue-100 font-medium">Báo cáo</a></li>
        <li><a href="07_settings.html" class="block py-2 px-3 rounded hover:bg-gray-100">Cài đặt</a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <h1 class="text-2xl font-bold mb-4">Báo cáo thống kê</h1>

      <!-- Filters -->
      <div class="bg-white p-4 rounded shadow mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Khoảng thời gian</label>
            <div class="flex space-x-2">
              <input type="date" class="border rounded w-full p-2" id="startDate">
              <input type="date" class="border rounded w-full p-2" id="endDate">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Loại báo cáo</label>
            <select class="border rounded w-full p-2" id="reportType">
              <option value="conversation">Số hội thoại</option>
              <option value="response_time">Thời gian phản hồi</option>
              <option value="message_volume">Lượng tin nhắn</option>
            </select>
          </div>
          <div class="flex items-end">
            <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full" onclick="generateReport()">Xem báo cáo</button>
          </div>
        </div>
      </div>

      <!-- Report Table -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200" id="reportTable">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Ngày</th>
              <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Số hội thoại</th>
              <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Tin nhận</th>
              <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Tin trả lời</th>
              <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Thời gian phản hồi trung bình (s)</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr class="bg-white">
              <td class="px-4 py-2 text-sm text-gray-800">2024-06-28</td>
              <td class="px-4 py-2 text-sm text-gray-800">124</td>
              <td class="px-4 py-2 text-sm text-gray-800">342</td>
              <td class="px-4 py-2 text-sm text-gray-800">330</td>
              <td class="px-4 py-2 text-sm text-gray-800">1.8</td>
            </tr>
            <tr class="bg-gray-50">
              <td class="px-4 py-2 text-sm text-gray-800">2024-06-27</td>
              <td class="px-4 py-2 text-sm text-gray-800">98</td>
              <td class="px-4 py-2 text-sm text-gray-800">275</td>
              <td class="px-4 py-2 text-sm text-gray-800">260</td>
              <td class="px-4 py-2 text-sm text-gray-800">2.1</td>
            </tr>
            <tr class="bg-white">
              <td class="px-4 py-2 text-sm text-gray-800">2024-06-26</td>
              <td class="px-4 py-2 text-sm text-gray-800">110</td>
              <td class="px-4 py-2 text-sm text-gray-800">310</td>
              <td class="px-4 py-2 text-sm text-gray-800">300</td>
              <td class="px-4 py-2 text-sm text-gray-800">1.9</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Export Buttons -->
      <div class="mt-4 flex space-x-2">
        <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" onclick="exportCSV()">Export CSV</button>
        <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" onclick="exportExcel()">Export Excel</button>
      </div>
    </main>
  </div>

  <script>
    function generateReport() {
      alert('Đang tải báo cáo (mock data).');
    }
    function exportCSV() {
      alert('Export CSV (mock).');
    }
    function exportExcel() {
      alert('Export Excel (mock).');
    }
  </script>
</body>
</html>
