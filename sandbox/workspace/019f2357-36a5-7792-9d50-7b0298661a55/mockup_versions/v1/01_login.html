<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Chatbot Zalo CS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-semibold text-gray-800 text-center mb-6">Đăng nhập</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>
      <div class="relative">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
        <input type="password" id="password" name="password" required
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        <button type="button" id="togglePwd"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700">
          👁️
        </button>
      </div>
      <div class="flex items-center justify-between">
        <label class="inline-flex items-center">
          <input type="checkbox" class="form-checkbox h-4 w-4 text-indigo-600">
          <span class="ml-2 text-sm text-gray-600">Ghi nhớ đăng nhập</span>
        </label>
        <a href="#" class="text-sm text-indigo-600 hover:underline">Quên mật khẩu?</a>
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">
        Đăng nhập
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">
      Chưa có tài khoản? <a href="#" class="text-indigo-600 hover:underline">Đăng ký</a>
    </p>
  </div>

  <script>
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // Mock login success - redirect to dashboard (placeholder)
      alert('Đăng nhập thành công!');
      // window.location.href = '02_dashboard.html';
    });
  </script>
</body>
</html>
