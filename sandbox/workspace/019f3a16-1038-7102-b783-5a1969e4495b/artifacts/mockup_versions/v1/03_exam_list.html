<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách kỳ thi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .modal { transition: opacity 0.25s ease; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-semibold text-gray-800">Quản lý kỳ thi</h1>
      <nav class="space-x-4">
        <a href="01_login.html" class="text-gray-600 hover:text-gray-900">Đăng nhập</a>
        <a href="02_dashboard.html" class="text-gray-600 hover:text-gray-900">Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-medium text-gray-800">Danh sách kỳ thi</h2>
        <button id="btnAddExam" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
          Tạo kỳ thi mới
        </button>
      </div>

      <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">#</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tên kỳ thi</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ngày bắt đầu</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Thời lượng</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Trạng thái</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Hành động</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <!-- Mock row 1 -->
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">1</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">Kỳ thi Toán học I</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">12/09/2024 08:00</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">120 phút</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                  Đang mở
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium space-x-2">
                <button data-id="1" class="viewBtn text-indigo-600 hover:text-indigo-900">Xem</button>
                <button data-id="1" class="editBtn text-green-600 hover:text-green-900">Sửa</button>
                <button data-id="1" class="deleteBtn text-red-600 hover:text-red-900">Xóa</button>
              </td>
            </tr>
            <!-- Mock row 2 -->
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">2</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">Kỳ thi Lý thuyết II</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">20/10/2024 09:30</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">90 phút</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">
                  Chưa mở
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium space-x-2">
                <button data-id="2" class="viewBtn text-indigo-600 hover:text-indigo-900">Xem</button>
                <button data-id="2" class="editBtn text-green-600 hover:text-green-900">Sửa</button>
                <button data-id="2" class="deleteBtn text-red-600 hover:text-red-900">Xóa</button>
              </td>
            </tr>
            <!-- Mock row 3 -->
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">3</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">Kỳ thi Hóa học cuối kỳ</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">05/12/2024 13:00</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">150 phút</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                  Đóng
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium space-x-2">
                <button data-id="3" class="viewBtn text-indigo-600 hover:text-indigo-900">Xem</button>
                <button data-id="3" class="editBtn text-green-600 hover:text-green-900">Sửa</button>
                <button data-id="3" class="deleteBtn text-red-600 hover:text-red-900">Xóa</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal (hidden by default) -->
  <div id="examModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden modal">
    <div class="bg-white rounded-lg overflow-hidden shadow-xl max-w-lg w-full">
      <div class="px-6 py-4 border-b">
        <h3 class="text-lg font-medium text-gray-800" id="modalTitle">Chi tiết kỳ thi</h3>
      </div>
      <div class="px-6 py-4 space-y-2" id="modalBody">
        <!-- Content injected by JS -->
      </div>
      <div class="px-6 py-3 bg-gray-50 text-right">
        <button id="closeModal" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    // Modal handling
    const modal = document.getElementById('examModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const closeModalBtn = document.getElementById('closeModal');

    function openModal(title, content) {
      modalTitle.textContent = title;
      modalBody.innerHTML = content;
      modal.classList.remove('hidden');
    }

    closeModalBtn.addEventListener('click', () => modal.classList.add('hidden'));

    // Mock data for exam details
    const examDetails = {
      1: {
        name: 'Kỳ thi Toán học I',
        start: '12/09/2024 08:00',
        duration: '120 phút',
        status: 'Đang mở',
        description: 'Kỳ thi bao gồm các phần: Đạo hàm, tích phân, đại số tuyến tính.'
      },
      2: {
        name: 'Kỳ thi Lý thuyết II',
        start: '20/10/2024 09:30',
        duration: '90 phút',
        status: 'Chưa mở',
        description: 'Kiểm tra kiến thức về cơ học và điện từ học.'
      },
      3: {
        name: 'Kỳ thi Hóa học cuối kỳ',
        start: '05/12/2024 13:00',
        duration: '150 phút',
        status: 'Đóng',
        description: 'Bao gồm phần lý thuyết và thực hành phòng thí nghiệm.'
      }
    };

    // View button handler
    document.querySelectorAll('.viewBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const data = examDetails[id];
        const content = `
          <p><strong>Tên kỳ thi:</strong> ${data.name}</p>
          <p><strong>Ngày bắt đầu:</strong> ${data.start}</p>
          <p><strong>Thời lượng:</strong> ${data.duration}</p>
          <p><strong>Trạng thái:</strong> ${data.status}</p>
          <p><strong>Mô tả:</strong> ${data.description}</p>
        `;
        openModal('Chi tiết kỳ thi', content);
      });
    });

    // Edit button placeholder
    document.querySelectorAll('.editBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        alert('Chức năng sửa chưa được triển khai trong mockup.');
      });
    });

    // Delete button placeholder
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Bạn có chắc muốn xóa kỳ thi này?')) {
          alert('Xóa thành công (mock).');
        }
      });
    });

    // Add exam button placeholder
    document.getElementById('btnAddExam').addEventListener('click', () => {
      alert('Mở form tạo kỳ thi (chưa triển khai trong mockup).');
    });
  </script>
</body>
</html>
