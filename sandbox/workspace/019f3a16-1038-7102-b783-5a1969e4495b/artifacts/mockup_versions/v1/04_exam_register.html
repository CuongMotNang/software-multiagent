<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký kỳ thi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-semibold text-gray-800">Đăng ký kỳ thi</h1>
      <nav>
        <a href="01_login.html" class="text-gray-600 hover:text-gray-900 mr-4">Đăng nhập</a>
        <a href="02_dashboard.html" class="text-gray-600 hover:text-gray-900">Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow">
    <div class="max-w-2xl mx-auto p-6">
      <form id="examRegisterForm" class="bg-white rounded-lg shadow-md p-6 space-y-6">
        <div>
          <label class="block text-gray-700 font-medium mb-2" for="examSelect">Chọn kỳ thi</label>
          <select id="examSelect" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">-- Chọn kỳ thi --</option>
            <option value="1">Kỳ thi Toán học - 15/09/2026</option>
            <option value="2">Kỳ thi Lý thuyết - 20/09/2026</option>
            <option value="3">Kỳ thi Tin học - 25/09/2026</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-2" for="fullName">Họ và tên</label>
          <input type="text" id="fullName" placeholder="Nhập họ và tên" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-2" for="studentId">Mã sinh viên</label>
          <input type="text" id="studentId" placeholder="VD: SV2023001" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex justify-end">
          <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-md hover:bg-indigo-700 transition">
            Đăng ký
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Xác nhận đăng ký</h2>
      <p id="modalMessage" class="text-gray-700 mb-6"></p>
      <div class="flex justify-end space-x-3">
        <button id="closeModal" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition">Đóng</button>
        <button id="confirmRegister" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">Xác nhận</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('examRegisterForm');
    const modal = document.getElementById('modalOverlay');
    const modalMsg = document.getElementById('modalMessage');
    const closeBtn = document.getElementById('closeModal');
    const confirmBtn = document.getElementById('confirmRegister');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const exam = document.getElementById('examSelect').value;
      const name = document.getElementById('fullName').value.trim();
      const id = document.getElementById('studentId').value.trim();

      if (!exam || !name || !id) {
        alert('Vui lòng điền đầy đủ thông tin.');
        return;
      }

      const examText = document.querySelector('#examSelect option:checked').textContent;
      modalMsg.textContent = `Bạn muốn đăng ký "${examText}" với tên "${name}" (Mã: ${id})?`;
      modal.classList.remove('hidden');
    });

    closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
    confirmBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      alert('Đăng ký thành công! Kiểm tra email để nhận thông báo.');
      form.reset();
    });
  </script>
</body>
</html>
