<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thi trực tuyến</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .question-card { transition: box-shadow .2s; }
    .question-card:hover { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between">
      <h1 class="text-2xl font-semibold text-gray-800">Kỳ thi: Toán học - Học kỳ 1</h1>
      <div class="flex items-center mt-3 md:mt-0 space-x-4">
        <div class="text-lg font-medium text-red-600" id="timer">00:45:00</div>
        <button id="submitBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
          Nộp bài
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-4xl mx-auto px-4 py-6 space-y-6">
      <!-- Question Navigation -->
      <div class="flex justify-between items-center mb-4">
        <button id="prevBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded disabled:opacity-50" disabled>
          ← Câu trước
        </button>
        <div class="text-sm text-gray-600">
          Câu <span id="currentIdx">1</span> / <span id="totalQuestions">5</span>
        </div>
        <button id="nextBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded">
          Câu tiếp → 
        </button>
      </div>

      <!-- Question Card -->
      <section id="questionContainer" class="bg-white rounded-lg shadow p-6 question-card">
        <!-- Content will be injected by JS -->
      </section>
    </div>
  </main>

  <!-- Modal for Confirm Submit -->
  <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg w-11/12 max-w-md p-6">
      <h2 class="text-xl font-semibold mb-4">Xác nhận nộp bài</h2>
      <p class="mb-6">Bạn có chắc muốn nộp bài ngay bây giờ? Hành động này không thể hoàn tác.</p>
      <div class="flex justify-end space-x-3">
        <button id="cancelSubmit" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded">Hủy</button>
        <button id="confirmSubmit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded">Nộp</button>
      </div>
    </div>
  </div>

  <script>
    // Mock data
    const questions = [
      {
        id: 1,
        type: 'multiple',
        text: 'Câu 1: Kết quả của 2 + 2 là gì?',
        options: ['1', '2', '3', '4'],
        answer: null
      },
      {
        id: 2,
        type: 'truefalse',
        text: 'Câu 2: Đất là hình trụ.',
        answer: null
      },
      {
        id: 3,
        type: 'multiple',
        text: 'Câu 3: Chọn các số chẵn:',
        options: ['1', '2', '3', '4'],
        multiple: true,
        answer: []
      },
      {
        id: 4,
        type: 'essay',
        text: 'Câu 4: Giải thích nguyên lý hoạt động của máy tính.',
        answer: ''
      },
      {
        id: 5,
        type: 'multiple',
        text: 'Câu 5: Hàm số y = x^2 có đồ thị nào dưới đây?',
        options: ['Parabola mở lên', 'Parabola mở xuống', 'Đường thẳng', 'H hyperbola'],
        answer: null
      }
    ];

    let currentIdx = 0;
    const totalQuestions = questions.length;

    const timerEl = document.getElementById('timer');
    let remainingSec = 45 * 60; // 45 minutes

    // Render question
    function renderQuestion() {
      const q = questions[currentIdx];
      const container = document.getElementById('questionContainer');
      container.innerHTML = `
        <h2 class="text-xl font-semibold mb-4">Câu ${currentIdx + 1}: ${q.text}</h2>
        ${renderAnswerInput(q)}
      `;
      document.getElementById('currentIdx').textContent = currentIdx + 1;
      document.getElementById('prevBtn').disabled = currentIdx === 0;
      document.getElementById('nextBtn').disabled = currentIdx === totalQuestions - 1;
    }

    function renderAnswerInput(q) {
      if (q.type === 'multiple') {
        const name = `q${q.id}`;
        return q.options.map((opt, i) => `
          <label class="block mb-2">
            <input type="${q.multiple ? 'checkbox' : 'radio'}" name="${name}" value="${opt}"
              ${q.multiple ? (q.answer.includes(opt) ? 'checked' : '') : (q.answer === opt ? 'checked' : '')}
              class="mr-2">
            ${opt}
          </label>
        `).join('');
      }
      if (q.type === 'truefalse') {
        return `
          <label class="block mb-2">
            <input type="radio" name="q${q.id}" value="true" ${q.answer === true ? 'checked' : ''} class="mr-2"> Đúng
          </label>
          <label class="block mb-2">
            <input type="radio" name="q${q.id}" value="false" ${q.answer === false ? 'checked' : ''} class="mr-2"> Sai
          </label>
        `;
      }
      if (q.type === 'essay') {
        return `<textarea id="essay_${q.id}" rows="6" class="w-full border rounded p-2" placeholder="Nhập câu trả lời...">${q.answer}</textarea>`;
      }
      return '';
    }

    // Save answer (mock auto‑save)
    function saveAnswer() {
      const q = questions[currentIdx];
      if (q.type === 'multiple') {
        const inputs = document.getElementsByName(`q${q.id}`);
        if (q.multiple) {
          q.answer = Array.from(inputs).filter(i => i.checked).map(i => i.value);
        } else {
          const checked = Array.from(inputs).find(i => i.checked);
          q.answer = checked ? checked.value : null;
        }
      } else if (q.type === 'truefalse') {
        const val = document.querySelector(`input[name="q${q.id}"]:checked`);
        q.answer = val ? (val.value === 'true') : null;
      } else if (q.type === 'essay') {
        q.answer = document.getElementById(`essay_${q.id}`).value;
      }
      console.log('Auto‑save', {questionId: q.id, answer: q.answer});
    }

    // Navigation
    document.getElementById('prevBtn').addEventListener('click', () => {
      saveAnswer();
      if (currentIdx > 0) currentIdx--;
      renderQuestion();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      saveAnswer();
      if (currentIdx < totalQuestions - 1) currentIdx++;
      renderQuestion();
    });

    // Timer
    function updateTimer() {
      const mins = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const secs = String(remainingSec % 60).padStart(2, '0');
      timerEl.textContent = `00:${mins}:${secs}`;
      if (remainingSec > 0) {
        remainingSec--;
      } else {
        clearInterval(timerInterval);
        autoSubmit();
      }
    }
    const timerInterval = setInterval(updateTimer, 1000);

    // Submit handling
    const modal = document.getElementById('confirmModal');
    document.getElementById('submitBtn').addEventListener('click', () => {
      saveAnswer();
      modal.classList.remove('hidden');
    });
    document.getElementById('cancelSubmit').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('confirmSubmit').addEventListener('click', () => {
      modal.classList.add('hidden');
      finalizeSubmit();
    });

    function autoSubmit() {
      alert('Thời gian đã hết. Bài sẽ được nộp tự động.');
      finalizeSubmit();
    }

    function finalizeSubmit() {
      console.log('Submitted answers:', questions);
      document.body.innerHTML = `
        <div class="flex items-center justify-center min-h-screen bg-gray-100">
          <div class="bg-white p-8 rounded shadow text-center">
            <h2 class="text-2xl font-semibold mb-4">Bạn đã nộp bài thành công!</h2>
            <p class="text-gray-600">Kết quả sẽ được công bố sau khi chấm.</p>
          </div>
        </div>
      `;
    }

    // Initial render
    document.getElementById('totalQuestions').textContent = totalQuestions;
    renderQuestion();
  </script>
</body>
</html>
