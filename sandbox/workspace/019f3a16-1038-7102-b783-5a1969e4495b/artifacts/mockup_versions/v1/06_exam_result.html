<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả kỳ thi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .modal { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-semibold text-gray-800">Kết quả kỳ thi</h1>
      <a href="02_dashboard.html" class="text-blue-600 hover:underline">← Quay lại Dashboard</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">
    <section class="max-w-7xl mx-auto p-4">
      <!-- Exam Info Card -->
      <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center">
          <div>
            <h2 class="text-xl font-medium text-gray-900">Kỳ thi: Toán học - Học kỳ 1</h2>
            <p class="text-gray-600">Ngày thi: 15/06/2026</p>
          </div>
          <div class="mt-4 md:mt-0">
            <span class="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">
              Đã công bố
            </span>
          </div>
        </div>
      </div>

      <!-- Filter & Export -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4">
        <div class="flex items-center space-x-2">
          <label for="statusFilter" class="text-sm font-medium text-gray-700">Trạng thái:</label>
          <select id="statusFilter" class="border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all">Tất cả</option>
            <option value="passed">Đạt</option>
            <option value="failed">Không đạt</option>
          </select>
        </div>
        <button id="exportBtn" class="mt-2 md:mt-0 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          Xuất PDF
        </button>
      </div>

      <!-- Results Table -->
      <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">STT</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Họ tên</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Mã sinh viên</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Điểm</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Xếp hạng</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Trạng thái</th>
              <th class="px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase">Chi tiết</th>
            </tr>
          </thead>
          <tbody id="resultBody" class="bg-white divide-y divide-gray-200">
            <!-- Mock rows -->
            <tr class="hover:bg-gray-50 cursor-pointer" data-student='{"name":"Nguyễn Văn A","id":"SV001","score":8.5,"rank":1,"status":"passed","answers":[{"q":"Câu 1","answer":"A","correct":"A"},{"q":"Câu 2","answer":"B","correct":"C"}]}' >
              <td class="px-4 py-2 text-sm text-gray-700">1</td>
              <td class="px-4 py-2 text-sm text-gray-700">Nguyễn Văn A</td>
              <td class="px-4 py-2 text-sm text-gray-700">SV001</td>
              <td class="px-4 py-2 text-sm text-gray-700">8.5</td>
              <td class="px-4 py-2 text-sm text-gray-700">1</td>
              <td class="px-4 py-2 text-sm">
                <span class="inline-block bg-green-100 text-green-800 px-2 py-0.5 rounded-full text-xs font-medium">Đạt</span>
              </td>
              <td class="px-4 py-2 text-center">
                <button class="text-blue-600 hover:underline text-sm view-detail">Xem</button>
              </td>
            </tr>
            <tr class="hover:bg-gray-50 cursor-pointer" data-student='{"name":"Trần Thị B","id":"SV002","score":5.0,"rank":15,"status":"failed","answers":[{"q":"Câu 1","answer":"B","correct":"A"},{"q":"Câu 2","answer":"D","correct":"C"}]}' >
              <td class="px-4 py-2 text-sm text-gray-700">2</td>
              <td class="px-4 py-2 text-sm text-gray-700">Trần Thị B</td>
              <td class="px-4 py-2 text-sm text-gray-700">SV002</td>
              <td class="px-4 py-2 text-sm text-gray-700">5.0</td>
              <td class="px-4 py-2 text-sm text-gray-700">15</td>
              <td class="px-4 py-2 text-sm">
                <span class="inline-block bg-red-100 text-red-800 px-2 py-0.5 rounded-full text-xs font-medium">Không đạt</span>
              </td>
              <td class="px-4 py-2 text-center">
                <button class="text-blue-600 hover:underline text-sm view-detail">Xem</button>
              </td>
            </tr>
            <!-- Add more mock rows as needed -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center hidden modal">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-lg mx-4">
      <div class="flex justify-between items-center border-b px-4 py-2">
        <h3 class="text-lg font-medium text-gray-800">Chi tiết kết quả</h3>
        <button id="closeModal" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>
      <div class="p-4" id="modalContent">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <script>
    // Filter functionality (simple client‑side)
    document.getElementById('statusFilter').addEventListener('change', function () {
      const filter = this.value;
      const rows = document.querySelectorAll('#resultBody tr');
      rows.forEach(row => {
        const status = row.dataset.student ? JSON.parse(row.dataset.student).status : '';
        if (filter === 'all' || status === filter) {
          row.classList.remove('hidden');
        } else {
          row.classList.add('hidden');
        }
      });
    });

    // Modal handling
    const modal = document.getElementById('detailModal');
    const modalContent = document.getElementById('modalContent');
    document.querySelectorAll('.view-detail').forEach(btn => {
      btn.addEventListener('click', function (e) {
        const row = e.target.closest('tr');
        const data = JSON.parse(row.dataset.student);
        let html = `<p class="mb-2"><strong>Họ tên:</strong> ${data.name}</p>`;
        html += `<p class="mb-2"><strong>Mã sinh viên:</strong> ${data.id}</p>`;
        html += `<p class="mb-2"><strong>Điểm:</strong> ${data.score}</p>`;
        html += `<p class="mb-4"><strong>Trạng thái:</strong> ${data.status === 'passed' ? 'Đạt' : 'Không đạt'}</p>`;
        html += `<h4 class="font-medium mb-2">Câu trả lời:</h4>`;
        html += `<ul class="list-disc list-inside">`;
        data.answers.forEach(a => {
          const correct = a.answer === a.correct ? '✅' : '❌';
          html += `<li>${a.q}: ${a.answer} (đúng: ${a.correct}) ${correct}</li>`;
        });
        html += `</ul>`;
        modalContent.innerHTML = html;
        modal.classList.remove('hidden');
      });
    });
    document.getElementById('closeModal').addEventListener('click', () => modal.classList.add('hidden'));
    // Close modal on outside click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });

    // Export button placeholder
    document.getElementById('exportBtn').addEventListener('click', () => {
      alert('Chức năng xuất PDF chưa được triển khai trong mockup.');
    });
  </script>
</body>
</html>
