<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Log Viewer</title>
<style>
  body {
    margin: 0;
    padding: 32px;
    background: #f7fafc;
    color: #2d3748;
    font-family: Inter, sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:16px;"><div style="font-size:20px;font-weight:bold;margin-bottom:8px;">Log Viewer</div><div style="display:flex;flex-direction:row;gap:12px;"><div style="margin-bottom:8px;"><label style="display:block;margin-bottom:4px;">Mức độ</label><select style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;"><option>All</option><option>Info</option><option>Warning</option><option>Error</option></select></div><div style="margin-bottom:4px;"><label style="display:block;margin-bottom:4px;font-size:12px;">Từ khóa</label><input type="text" placeholder="Tìm kiếm..." style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;font-family:inherit;box-sizing:border-box;" /></div><button style="background:#2f855a;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;font-family:inherit;cursor:pointer;">Áp dụng</button><button style="background:#2f855a;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;font-family:inherit;cursor:pointer;">Xuất CSV</button></div><table style="width:100%;border-collapse:collapse;margin-bottom:16px;"><thead><tr><th style="text-align:left;padding:8px;border-bottom:2px solid #2d3748;">Thời gian</th><th style="text-align:left;padding:8px;border-bottom:2px solid #2d3748;">Mức độ</th><th style="text-align:left;padding:8px;border-bottom:2px solid #2d3748;">Tin nhắn</th></tr></thead><tbody></tbody></table></div>
</body>
</html>
